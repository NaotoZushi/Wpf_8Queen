name: CI

on:
  push:
    branches: ["master", "feature/**"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Wpf_8Queen.sln

      - name: Build
        run: dotnet build Wpf_8Queen.sln --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test Wpf_8Queen.Tests/Wpf_8Queen.Tests.csproj --configuration Release --no-build
